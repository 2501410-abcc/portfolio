<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ハンター登録</title>
    <link rel="stylesheet" href="style.css" />
    <!-- javascriptの読み込み-->
    <script src="script.js" type="text/javascript" charset="UTF-8"></script>
  </head>
  <body>
    <div class="container">
      <h1 class="title">ハンター登録</h1>
      <div class="form-group">
        <label for="hunterName">ハンター名:</label>
        <input
          type="text"
          id="hunterName"
          name="hunterName"
          placeholder="ハンター名を入力"
        />
      </div>
      <!-- ボタンをクリックするとハンター名を保存してページ遷移する関数を呼び出す -->
      <button class="btn" onclick="btnClick()">ひと狩りいこうぜ！</button>
    </div>
  </body>
</html>
